<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a49">
<title>このみち（プロトタイプ）</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="map" role="application" aria-label="地図"></div>

  <!-- 設定・結果パネル -->
  <aside id="panel" aria-live="polite">
    <header class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="30" height="30"><circle cx="16" cy="16" r="16" fill="#1f7a49"/><path d="M6 22c4-1 5-6 9-6s5 5 11 4" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="22" cy="10" r="3" fill="#9ad4ff"/></svg>
      </div>
      <div>
        <h1>このみち</h1>
        <p class="tagline">空き時間に、好きな景色の道を歩こう</p>
      </div>
      <button id="btnDiag" class="icon-btn" type="button" aria-label="計測値（実現性の確認用）を開く" title="計測値">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M5 20V10h3v10H5zm5.5 0V4h3v16h-3zM16 20v-7h3v7h-3z"/></svg>
      </button>
    </header>
    <div id="view"></div>
  </aside>

  <!-- 地図ツール -->
  <div id="mapTools">
    <label class="chip-toggle"><input type="checkbox" id="chkLayers"> <span>緑・水辺の元データを表示</span></label>
  </div>

  <!-- 案内中の表示 -->
  <section id="guideTop" class="hidden" aria-live="assertive"></section>
  <section id="guideBottom" class="hidden"></section>

  <div id="toast" class="hidden" role="status"></div>
</div>

<dialog id="diag">
  <form method="dialog">
    <h2>計測値（実現性の確認用）</h2>
    <div id="diagBody"></div>
    <p class="fine">地図データ © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>（ODbL）</p>
    <button class="btn primary">閉じる</button>
  </form>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
